<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Compatibility</title>
</head>
<body>
    <!-- Providing multiple source formats ensures cross-browsers support different audio formats. If
     the first format doesn't support it automatically skip to next one' -->
    <audio>
        <source src="audio.mp3" type="audio/mp3">
        <source src="audio.ogg" type="audio/ogg">
    </audio>
</body>
</html>
